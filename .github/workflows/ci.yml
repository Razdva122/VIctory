name: Windows contribution checks

on:
  push:
    branches: [ci/verify-nov24-contributions]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.change }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - change: MTBUF conversion
            revision: a291bc609819104e2de6a7a02e0239c68cf5e7bb
          - change: Packed texture layout
            revision: 87c7892ca3312018195d316e7a155cf291efdbca
          - change: Shader hash replay
            revision: 651cc2ac1a3563bc691f5a782b3b5434647f97f9
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision }}
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
