name: Contribution verification

on:
  push:
    branches: [ci/verify-nov25-tasks]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Benchmark timing at 48f115c
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 48f115c4ab3665ef784115816bee9c10f977a4aa
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Compile benchmark tests
        run: cargo test --locked -p xtask --no-run
      - name: Time benchmark self-tests with build cache warm
        shell: pwsh
        run: |
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo test --locked -p xtask bench:: -- --test-threads=1 --nocapture
          $code = $LASTEXITCODE
          $clock.Stop()
          Write-Host "Benchmark self-tests including cargo startup took $($clock.ElapsedMilliseconds) ms"
          exit $code

  controller:
    name: Controller diagram in diagnostics mode at 8a485ee
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 8a485ee441c087f2ba1fe6fddb9be40e9f7662b8
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run diagram and DirectStorage tests
        run: |
          cargo test --locked -p victory-hle --features diagnostics modules::files::diagram
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p victory-hle --features diagnostics modules::dstorage
