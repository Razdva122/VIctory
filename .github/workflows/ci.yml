name: Contribution verification

on:
  push:
    branches: [ci/verify-nov25-tasks]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Windows benchmark f20593f
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f20593fb262e3d31dc18928f89ba39c0b868eefd
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Time benchmark self-tests with build cache warm
        shell: pwsh
        run: |
          $clock = [Diagnostics.Stopwatch]::StartNew()
          cargo test --locked -p xtask bench:: -- --test-threads=1 --nocapture
          $code = $LASTEXITCODE
          $clock.Stop()
          Write-Host "Benchmark self-tests including cargo startup took $($clock.ElapsedMilliseconds) ms"
          exit $code
