name: Contribution verification

on:
  push:
    branches: [ci/verify-nov25-tasks]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: GPU and formats 365a2a4
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 365a2a491ffde3629b57cceb3855e34565baa5ae
          fetch-depth: 2
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

      - name: Combine the old mapping code with the new regression
        shell: python
        run: |
          import pathlib, subprocess
          path = 'crates/victory-hle/src/modules/xmem.rs'
          old = subprocess.check_output(['git', 'show', 'HEAD^:' + path]).decode()
          file = pathlib.Path(path)
          marker = '#[cfg(test)]' + chr(10) + 'mod tests'
          old_impl, separator, _ = old.partition(marker)
          _, separator_new, tests = file.read_text(encoding='utf-8').partition(marker)
          assert separator and separator_new
          file.write_text(old_impl + marker + tests, encoding='utf-8')
      - name: Verify that the old implementation fails the overlap regression
        shell: pwsh
        run: |
          cargo test --locked -p victory-hle gpu_page_copies_keep_the_source_mappings -- --nocapture *> old-mappings.txt
          $result = $LASTEXITCODE
          Get-Content old-mappings.txt | Select-Object -Last 35
          if ($result -eq 0 -or !(Select-String -Quiet -Path old-mappings.txt -SimpleMatch -Pattern 'assertion failed: copy(1, 0, 4)', 'right: [1, 1, 2, 3, 4]')) {
            throw 'Expected the previous map_alias to fail the overlapping copy assertion'
          }
          exit 0
